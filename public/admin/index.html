<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Festival ADAR · Panel</title>
  <style>
    /* Acceso flotante al Kit de redes. Position fixed y z-index alto para que
       conviva con la interfaz del CMS sin interferir con ella. */
    .adar-kit-link {
      position: fixed; right: 18px; bottom: 18px; z-index: 2147483000;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 16px; border-radius: 999px;
      background: #f5d72f; color: #0a0907; text-decoration: none;
      font: 500 13px/1 ui-monospace, "JetBrains Mono", monospace;
      box-shadow: 0 4px 16px rgba(10, 9, 7, .28);
    }
    .adar-kit-link:hover { background: #0a0907; color: #f5d72f; }
    .adar-kit-link.ghost { background: #0a0907; color: #f5d72f; right: 165px; }
    .adar-kit-link.ghost:hover { background: #f5d72f; color: #0a0907; }
    @media print { .adar-kit-link { display: none; } }

    /* Aviso cuando llegas aquí desde una vista previa de borrador. */
    .adar-preview-note {
      position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
      z-index: 2147483000; max-width: min(560px, 92vw);
      background: #0a0907; color: #f6f4ee; border-left: 4px solid #f5d72f;
      padding: 12px 16px; border-radius: 8px;
      font: 400 13px/1.5 ui-monospace, "JetBrains Mono", monospace;
      box-shadow: 0 6px 22px rgba(10, 9, 7, .32);
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    .adar-preview-note a { color: #f5d72f; }
    .adar-preview-note button {
      margin-left: auto; background: none; border: 0; color: #f6f4ee;
      cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px;
    }
  </style>
</head>
<body>
  <!-- Panel de edición del blog (Sveltia CMS). Guarda en el repo (rama main) y
       Vercel reconstruye. La aprobación es el campo "Estado": un artículo solo
       se ve en la web cuando lo marcas como "Publicado". -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>

  <a class="adar-kit-link ghost" href="/borradores/" target="_blank" rel="noopener">
    ↗ Borradores
  </a>
  <a class="adar-kit-link" href="/kit-redes/" target="_blank" rel="noopener">
    ↗ Kit de redes
  </a>
  <a class="adar-kit-link" href="/calendario/" target="_blank" rel="noopener">
    ↗ Calendario
  </a>

  <script>
    // Si llegas a una página interna sin sesión, el middleware te trae aquí.
    // Mostramos el aviso con el enlace para volver una vez iniciada la sesión.
    // La expresión exige que empiece por una de las rutas conocidas, así que
    // no sirve para colar una redirección a otro dominio («//otrositio»).
    (function () {
      var target = new URLSearchParams(location.search).get('preview');
      if (!target || !/^\/(borradores|kit-redes|kit-redes-creartbox|calendario)\//.test(target)) return;
      var box = document.createElement('div');
      box.className = 'adar-preview-note';
      box.innerHTML =
        '<span>Inicia sesión con GitHub y luego vuelve: ' +
        '<a href="' + target.replace(/"/g, '&quot;') + '">' + target + '</a></span>' +
        '<button type="button" aria-label="Cerrar">✕</button>';
      box.querySelector('button').addEventListener('click', function () { box.remove(); });
      document.body.appendChild(box);
    })();
  </script>
</body>
</html>
